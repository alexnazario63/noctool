<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NOC TOOL Admin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <section class="admin-login" id="loginView" aria-label="Login administrativo">
        <form class="admin-card" id="loginForm">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i data-lucide="shield"></i></span>
            <div>
              <p class="eyebrow">Admin</p>
              <h1>NOC TOOL</h1>
            </div>
          </div>
          <label class="field">
            <span>Login</span>
            <input id="adminUser" type="text" autocomplete="username" value="admin">
          </label>
          <label class="field">
            <span>Senha</span>
            <input id="adminPass" type="password" autocomplete="current-password" placeholder="admin123">
          </label>
          <button class="primary-button" type="submit"><i data-lucide="log-in"></i> Entrar</button>
          <p class="admin-status" id="loginStatus" role="status"></p>
        </form>
      </section>

      <section class="admin-dashboard" id="dashboardView" hidden>
        <nav class="navbar admin-navbar">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"><i data-lucide="settings-2"></i></span>
            <div>
              <p class="eyebrow">Configurações locais</p>
              <h1>Admin</h1>
            </div>
          </div>
          <div class="navbar-actions">
            <a class="ghost-button" href="/"><i data-lucide="arrow-left"></i> Voltar</a>
            <button class="ghost-button" id="logoutButton" type="button"><i data-lucide="log-out"></i> Sair</button>
          </div>
        </nav>

        <div class="admin-grid">
          <aside class="admin-tabs" aria-label="Seções">
            <button class="admin-tab is-active" type="button" data-admin-tab="partners"><i data-lucide="building-2"></i> Parceiros</button>
            <button class="admin-tab" type="button" data-admin-tab="messages"><i data-lucide="message-square-text"></i> Mensagens</button>
            <button class="admin-tab" type="button" data-admin-tab="failures"><i data-lucide="list-tree"></i> Tipos de falha</button>
            <button class="admin-tab" type="button" data-admin-tab="stamp"><i data-lucide="clipboard-list"></i> Carimbo</button>
            <button class="admin-tab" type="button" data-admin-tab="fields"><i data-lucide="sliders-horizontal"></i> Campos</button>
          </aside>

          <form class="admin-content" id="adminForm">
            <section class="admin-section is-active" data-admin-section="partners">
              <div class="admin-section-head">
                <h2>Parceiros</h2>
                <button class="small-button" id="addPartnerButton" type="button"><i data-lucide="plus"></i> Adicionar parceiro</button>
              </div>
              <div class="admin-list" id="partnersListAdmin"></div>
            </section>

            <section class="admin-section" data-admin-section="messages">
              <h2>Mensagens padrão</h2>
              <p class="admin-help">Use uma mensagem por linha. Placeholders: {greeting}, {ticket}, {designator}, {carrier}.</p>
              <textarea id="chargeMessagesAdmin" rows="9"></textarea>
            </section>

            <section class="admin-section" data-admin-section="failures">
              <h2>Tipos de falha</h2>
              <p class="admin-help">Use o formato NOME=CODIGO, um por linha.</p>
              <textarea id="failureTypesAdmin" rows="12"></textarea>
            </section>

            <section class="admin-section" data-admin-section="stamp">
              <h2>Textos de carimbo</h2>
              <div class="field-row two">
                <label class="field"><span>Introdução do e-mail</span><input id="stampEmailIntro" type="text"></label>
                <label class="field"><span>Tipo de indisponibilidade</span><input id="stampOutageText" type="text"></label>
                <label class="field"><span>Sintoma padrão</span><input id="stampSymptom" type="text"></label>
                <label class="field"><span>Diagnóstico padrão</span><input id="stampDiagnosis" type="text"></label>
                <label class="field"><span>Facilidades padrão</span><input id="stampFacilities" type="text"></label>
                <label class="field"><span>O que foi falado</span><input id="stampSpokenText" type="text"></label>
              </div>
            </section>

            <section class="admin-section" data-admin-section="fields">
              <h2>Campos padrão</h2>
              <div class="field-row two">
                <label class="field"><span>Contato do analista</span><input id="defaultContactAdmin" type="text"></label>
                <label class="field"><span>Nome do analista</span><input id="defaultRequesterAdmin" type="text"></label>
                <label class="field"><span>Cópia padrão</span><input id="defaultCopyAdmin" type="text"></label>
                <label class="field"><span>Canal padrão</span><input id="defaultChannelAdmin" type="text"></label>
              </div>
            </section>

            <div class="admin-actions">
              <button class="ghost-button danger" id="resetAdminButton" type="button"><i data-lucide="trash-2"></i> Limpar configurações</button>
              <button class="primary-button" type="submit"><i data-lucide="save"></i> Salvar alterações</button>
            </div>
            <p class="admin-status" id="adminStatus" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="admin.js"></script>
  </body>
</html>
